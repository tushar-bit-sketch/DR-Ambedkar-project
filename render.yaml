services:
  # ----------------------------------------------------------------------------
  # FastAPI Institutional Backend Service
  # ----------------------------------------------------------------------------
  - type: web
    name: ambedkar-archive-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ambedkar-archive-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["https://ambedkar-archive.vercel.app","http://localhost:5173"]'
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: BAAI/bge-m3
      - key: HF_BASE_URL
        value: https://router.huggingface.co/v1
      - key: VECTOR_BACKEND
        value: PGVECTOR
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: SECURITY_HEADERS_ENABLED
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"

databases:
  # ----------------------------------------------------------------------------
  # Managed PostgreSQL Database with pgvector
  # ----------------------------------------------------------------------------
  - name: ambedkar-archive-db
    databaseName: ambedkar_archive
    user: archive_admin
    region: oregon
    plan: starter
    postgresMajorVersion: 16
